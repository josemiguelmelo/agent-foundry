name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  plugin-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CLI
        run: pip install -e .
      - name: CLI help
        run: agent-foundry --help
      - name: Validate plugins
        run: agent-foundry validate-plugins

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CLI
        run: pip install -e .
      - name: Run unit tests
        run: python -m unittest discover -s tests -p "test_*.py"

  required-checks:
    name: required-checks
    runs-on: ubuntu-latest
    needs:
      - plugin-validation
      - unit-tests
    if: ${{ always() }}
    steps:
      - name: Enforce required checks are green
        run: |
          if [[ "${{ needs.plugin-validation.result }}" != "success" || "${{ needs.unit-tests.result }}" != "success" ]]; then
            echo "Required checks failed or were not executed."
            exit 1
          fi
