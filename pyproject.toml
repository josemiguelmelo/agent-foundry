[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-foundry"
version = "1.0.0"
description = "CLI for installing agent-foundry plugins into Codex, Claude Code, Cursor, and Copilot CLI."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pyyaml>=6.0.1",
]

[project.scripts]
agent-foundry = "agent_foundry.cli:main"

[project.urls]
Documentation = "https://josemiguelmelo.github.io/agent-foundry/"
Repository = "https://github.com/josemiguelmelo/agent-foundry"

[tool.setuptools.packages.find]
where = ["."]
include = ["agent_foundry*"]
